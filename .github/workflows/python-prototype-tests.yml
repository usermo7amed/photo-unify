name: Python prototype tests

on:
  push:
    branches:
      - "**"
    paths:
      - "tools/prototype/**"
      - ".github/workflows/python-prototype-tests.yml"
  pull_request:
    paths:
      - "tools/prototype/**"
      - ".github/workflows/python-prototype-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-prototype-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Prototype unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless

      - name: Run regression tests
        run: python -m unittest discover -s tools/prototype/tests -v
