name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Install Android 34 emulator image with retries
        shell: bash
        run: |
          set -eu
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          image_package="system-images;android-34;google_apis;x86_64"

          # android-actions/setup-android installs command-line tools, configures PATH,
          # and accepts the SDK licenses before this step runs.
          command -v sdkmanager
          sdkmanager --version

          for attempt in 1 2 3; do
            echo "Installing ${image_package} (attempt ${attempt}/3)"
            if sdkmanager --install "${image_package}" --channel=0 && \
              test -f "${sdk_root}/system-images/android-34/google_apis/x86_64/package.xml"; then
              echo "Android emulator system image is installed."
              exit 0
            fi

            echo "::warning::Android system image installation failed on attempt ${attempt}."
            # Remove any partially extracted package or damaged download before retrying.
            rm -rf "${sdk_root}/system-images/android-34/google_apis/x86_64"
            rm -rf "${sdk_root}/.temp"

            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Could not install the Android 34 emulator image after 3 attempts."
          exit 1

      - name: Run document crop instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # Keep this as one shell command: android-emulator-runner executes script lines separately.
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.captureVisualAudit=true --no-daemon --stacktrace; test_status=$?; output_dir=app/build/reports/androidTests/connected/visual-audit-emulator; mkdir -p "$output_dir"; for file in home-selected.png adjustment.png crop-workspace.png home-empty.png crop-review.png result-processing.png result-export.png crop-workspace-landscape.png; do if adb -s emulator-5554 pull "/sdcard/Pictures/PhotoUnifierVisualAudit/$file" "$output_dir/$file" >/dev/null && [ -s "$output_dir/$file" ]; then echo "Collected visual audit screenshot: $file"; else echo "::error::Unable to collect visual audit screenshot: $file"; rm -f "$output_dir/$file"; test_status=1; fi; done; screenshot_count=$(find "$output_dir" -maxdepth 1 -type f -name '*.png' -size +0c | wc -l | tr -d ' '); if [ "$screenshot_count" -ne 8 ]; then echo "::error::Expected 8 non-empty emulator screenshots, found $screenshot_count."; test_status=1; fi; exit "$test_status"

      # Preserve test diagnostics even if connected instrumentation tests fail.
      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: photo-unifier-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
