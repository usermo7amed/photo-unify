name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Install Android 34 emulator image with retries
        shell: bash
        run: |
          # Do not use pipefail here: 'yes' may be closed by sdkmanager after all
          # licenses are accepted, while sdkmanager itself can still succeed.
          set -eu
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          image_package="system-images;android-34;google_apis;x86_64"

          yes | sdkmanager --licenses > /dev/null

          for attempt in 1 2 3; do
            echo "Installing ${image_package} (attempt ${attempt}/3)"
            if sdkmanager --install "${image_package}" --channel=0 && \
              test -f "${sdk_root}/system-images/android-34/google_apis/x86_64/package.xml"; then
              echo "Android emulator system image is installed."
              exit 0
            fi

            echo "::warning::Android system image installation failed on attempt ${attempt}."
            # Remove any partially extracted package or damaged download before retrying.
            rm -rf "${sdk_root}/system-images/android-34/google_apis/x86_64"
            rm -rf "${sdk_root}/.temp"

            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Could not install the Android 34 emulator image after 3 attempts."
          exit 1

      - name: Run document crop instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: photo-unifier-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
